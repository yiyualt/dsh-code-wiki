<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>开源代码仓管理规范和纪律 · DSH 代码百科</title>
  <style>
    :root {
      color-scheme: light;
      --background: #f7f5f2;
      --text: #262321;
      --accent: #8c1515;
      --border: #e2dcd6;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font: 1rem/1.65 system-ui, sans-serif;
    }

    main {
      max-width: 55rem;
      margin: 0 auto;
      padding: clamp(2rem, 6vw, 3rem) clamp(1rem, 4vw, 1.5rem) 3rem;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 6vw, 3.25rem);
      line-height: 1.18;
    }

    h1 span { display: inline-block; }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 1.25rem;
      margin: 1.2rem 0 1.75rem;
      padding-bottom: 1.15rem;
      border-bottom: 1px solid var(--border);
      font-size: 0.9375rem;
    }

    a {
      color: var(--accent);
      text-underline-offset: 0.22em;
    }

    a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 4px;
    }

    section {
      padding: 1rem 1.2rem;
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      background: #fff;
      scroll-margin-top: 1rem;
    }

    section + section { margin-top: 0.8rem; }
    section:target { border-color: var(--accent); }

    h2 {
      display: flex;
      align-items: baseline;
      gap: 0.65rem;
      margin: 0;
      font-size: 1.25rem;
      line-height: 1.4;
    }

    .number {
      color: var(--accent);
      font-size: 0.9375rem;
      font-variant-numeric: tabular-nums;
    }

  </style>
</head>
<body>
  <main>
    <header>
      <h1>开源代码仓<span>管理规范和纪律</span></h1>
    </header>

    <nav aria-label="章节目录">
      <a href="#license">开源许可</a>
      <a href="#issues">Issue 管理</a>
      <a href="#contributions">权限、分支、提交与 PR</a>
      <a href="#review">评审与合并</a>
      <a href="#release">版本与发布</a>
      <a href="#maintenance">维护与交接</a>
    </nav>

    <section id="license" aria-labelledby="license-title">
      <h2 id="license-title"><span class="number" aria-hidden="true">01</span>开源许可</h2>
    </section>

    <section id="issues" aria-labelledby="issues-title">
      <h2 id="issues-title"><span class="number" aria-hidden="true">02</span>Issue 与需求管理</h2>
    </section>

    <section id="contributions" aria-labelledby="contributions-title">
      <h2 id="contributions-title"><span class="number" aria-hidden="true">03</span>仓库权限、分支、提交与 PR</h2>
    </section>

    <section id="review" aria-labelledby="review-title">
      <h2 id="review-title"><span class="number" aria-hidden="true">04</span>评审、持续集成与合并</h2>
    </section>

    <section id="release" aria-labelledby="release-title">
      <h2 id="release-title"><span class="number" aria-hidden="true">05</span>版本、安装包与发布</h2>
    </section>

    <section id="maintenance" aria-labelledby="maintenance-title">
      <h2 id="maintenance-title"><span class="number" aria-hidden="true">06</span>回滚、日常维护与交接</h2>
    </section>
  </main>
</body>
</html>
